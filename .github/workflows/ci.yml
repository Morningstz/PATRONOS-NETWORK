name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patronos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patronos_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/patronos_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patronos_test
      AUTH_MODE: dev
      SESSION_SECRET: ci-session-secret-0123456789abcdefghijklmn
      IP_HASH_SALT: ci-salt-0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migration check (schema matches migrations)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE patronos_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/patronos_shadow --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E + accessibility
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
